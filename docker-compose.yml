services:
  postgres:
    image: postgres:16-alpine
    container_name: roxiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roxiler
    ports:
      - "5432:5432"
    volumes:
      - roxiler-postgres-data:/var/lib/postgresql/data

volumes:
  roxiler-postgres-data:
